version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: realty_db
    environment:
      POSTGRES_USER: realty_user
      POSTGRES_PASSWORD: realty_password
      POSTGRES_DB: realty_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - realty_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realty_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://realty_user:realty_password@db:5432/realty_db
      SECRET_KEY: your-super-secret-key-change-in-production
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - realty_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: realty_frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - realty_network
    command: npm start

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: realty_admin
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - realty_network
    command: npm start

  nginx:
    image: nginx:alpine
    container_name: realty_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
      - admin
    networks:
      - realty_network

volumes:
  postgres_data:

networks:
  realty_network:
    driver: bridge